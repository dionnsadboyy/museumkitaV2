<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4e9e8" />
    <meta name="description" content="Cerita dan kenangan Dion &amp; Chelsea." />
    <title>Our Museum — Dion &amp; Chelsea</title>
    <link rel="stylesheet" href="./archive.css" />
    <script defer src="./data.js"></script>
    <script defer src="./archive.js"></script>
  </head>
  <body>
    <header class="museum-header" id="top">
      <a class="brand" href="./archive.html" aria-label="Our Museum, Archive">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 40 34"><path d="M3 11 20 3l17 8H3Zm4 3h26M8 15v12m8-12v12m8-12v12m8-12v12M5 29h30M3 32h34" /></svg>
        </span>
        <span class="brand__copy">
          <span class="brand__name">Our Museum</span>
          <span class="brand__motto">every memory deserves a place.</span>
        </span>
      </a>

      <div class="header-actions">
        <button class="icon-button" id="search-toggle" type="button" aria-label="Cari di archive" aria-expanded="false" aria-controls="archive-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m16 16 5 5"/></svg>
        </button>
        <button class="icon-button icon-button--more" id="menu-toggle" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="quick-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
        <nav class="quick-menu" id="quick-menu" aria-label="Navigasi halaman" hidden>
          <a href="#our-story">Our Story</a>
          <a href="#chapters">Chapters</a>
        </nav>
      </div>
    </header>

    <main>
      <form class="search-panel" id="archive-search" role="search" hidden>
        <label for="search-input">Cari memory di archive</label>
        <input id="search-input" type="search" placeholder="Judul chapter, lokasi, cerita…" autocomplete="off" />
      </form>

      <section class="story-feature" id="our-story" aria-labelledby="story-title">
        <div class="story-feature__photo-wrap">
          <figure class="story-photo">
            <img src="/assets/images/painting-date/painting-date2.jpeg" alt="Momen piknik bersama saat senja di tepi danau" fetchpriority="high" />
            <figcaption>same sky,<br />different story</figcaption>
          </figure>
          <div class="mini-prints" aria-hidden="true">
            <figure><img src="/assets/images/painting-date/painting-date8.jpeg" alt="" loading="lazy" decoding="async" /></figure>
            <figure><img src="/assets/images/painting-date/painting-date10.jpeg" alt="" loading="lazy" decoding="async" /></figure>
          </div>
        </div>
        <div class="story-feature__copy">
          <p class="section-index"><span>01</span><i></i></p>
          <h1 id="story-title">Our Story</h1>
          <p class="story-feature__description">dari awal kita bertemu,<br class="wide-break" /> sampai semua cerita sekarang.</p>
          <a class="round-link" href="./story.html" aria-label="Baca Our Story">
            <svg viewBox="0 0 24 18" aria-hidden="true"><path d="M2 9h19m-7-7 7 7-7 7" /></svg>
          </a>
          <span class="story-note" aria-hidden="true">for a brighter us. ♡</span>
        </div>
      </section>

      <section class="memories" id="chapters" aria-labelledby="memories-title">
        <div class="memories__heading">
          <p class="section-index"><span>02</span><i></i></p>
          <h2 id="memories-title">Chapters</h2>
          <p class="memories__description">pilih satu bagian, lalu ikuti lagi cerita di dalamnya.</p>
        </div>

        <div class="archive-controls">
          <p class="chapter-count" id="chapter-count"></p>
          <div class="view-toggle" role="group" aria-label="Tampilan chapter">
            <button class="view-toggle__button is-active" type="button" data-view="grid" aria-label="Tampilan grid" aria-pressed="true">
              <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="6" height="6" rx="1"/><rect x="12" y="2" width="6" height="6" rx="1"/><rect x="2" y="12" width="6" height="6" rx="1"/><rect x="12" y="12" width="6" height="6" rx="1"/></svg>
            </button>
            <button class="view-toggle__button" type="button" data-view="list" aria-label="Tampilan list" aria-pressed="false">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4h11M7 10h11M7 16h11"/><circle cx="3" cy="4" r=".7"/><circle cx="3" cy="10" r=".7"/><circle cx="3" cy="16" r=".7"/></svg>
            </button>
          </div>
        </div>

        <div class="chapter-grid" id="chapter-grid" aria-live="polite"></div>
        <p class="empty-state" id="empty-state" hidden>Tidak ada chapter yang cocok.</p>
      </section>
    </main>

    <nav class="bottom-dock" aria-label="Navigasi archive">
      <a class="bottom-dock__item is-current" href="#top" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10h-6v-6H9v6H3z"/><path d="M1.5 10 12 2l10.5 8"/></svg>
        <span>Archive</span>
      </a>
      <a class="bottom-dock__item" href="#our-story">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5c3-1.5 6-1 9 1v15c-3-2-6-2.5-9-1V5Zm18 0c-3-1.5-6-1-9 1v15c3-2 6-2.5 9-1V5Z"/><path d="M6 9c1.2-.3 2.2 0 3 .5M18 9c-1.2-.3-2.2 0-3 .5"/></svg>
        <span>Our Story</span>
      </a>
      <a class="bottom-dock__item" href="#chapters">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 2v4m10-4v4M3 9h18"/><path d="m8 15 2.5 2.5L16 12"/></svg>
        <span>Chapters</span>
      </a>
    </nav>
  </body>
</html>
