<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eee3f0" />
    <meta
      name="description"
      content="Museum kecil untuk menyimpan cerita Dion dan Chelsea."
    />
    <title>Museum Kita — Dion &amp; Chelsea</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="opening" id="top">
      <div class="backdrop" aria-hidden="true">
        <img class="backdrop__photo backdrop__photo--sunset" src="/assets/images/painting-date/painting-date2.jpeg" alt="" />
        <img class="backdrop__photo backdrop__photo--together" src="/assets/images/painting-date/painting-date8.jpeg" alt="" />
        <span class="backdrop__wash"></span>
      </div>

      <article class="cover" aria-labelledby="cover-title">
        <header class="cover__top">
          <div class="private-label">
            <span class="private-label__dot" aria-hidden="true"></span>
            <span>Private Museum</span>
            <svg aria-hidden="true" viewBox="0 0 16 18" class="lock-icon">
              <path d="M4.3 7V5a3.7 3.7 0 0 1 7.4 0v2M3 7h10v9H3z" />
            </svg>
          </div>
          <span class="cover__seal" aria-hidden="true">✿</span>
        </header>

        <div class="cover__intro">
          <svg class="museum-mark" viewBox="0 0 40 32" aria-hidden="true">
            <path d="M3 10 20 2l17 8H3Z" />
            <path d="M6 12h28M8 13v13m8-13v13m8-13v13m8-13v13M5 28h30M3 31h34" />
          </svg>
          <p class="eyebrow">Welcome to</p>
          <h1 id="cover-title"><span>Our</span><span>Museum</span></h1>
          <p class="cover__motto">every memory<br />deserves a place.</p>
        </div>

        <div class="established">
          <span class="established__label">Established</span>
          <span class="established__rule" aria-hidden="true"></span>
          <span class="established__date">June 2026</span>
        </div>

        <blockquote class="quote-note">
          <span class="quote-note__mark" aria-hidden="true">“</span>
          <p>Some moments deserve<br class="desktop-break" /> more than a gallery.<br />They deserve a museum.</p>
          <span class="quote-note__heart" aria-hidden="true">♡</span>
        </blockquote>

        <a class="enter-button" href="./archive.html">
          <span>Enter Museum</span>
          <svg viewBox="0 0 28 20" aria-hidden="true"><path d="M2 10h23m-8-8 8 8-8 8" /></svg>
        </a>

        <footer class="cover__footer">
          <div class="footer-rule"><span aria-hidden="true">♡</span></div>
          <p>Curated for Dion &amp; Chelsea</p>
        </footer>

        <span class="scribble scribble--left" aria-hidden="true">♡</span>
        <span class="scribble scribble--right" aria-hidden="true">✳</span>
      </article>

      <figure class="polaroid polaroid--sunset" aria-hidden="true">
        <img src="/assets/images/painting-date/painting-date2.jpeg" alt="" />
        <figcaption>little moments, kept close</figcaption>
      </figure>
      <figure class="polaroid polaroid--together" aria-hidden="true">
        <img src="/assets/images/painting-date/painting-date8.jpeg" alt="" />
        <figcaption>still here, still us.</figcaption>
      </figure>
    </main>
  </body>
</html>
