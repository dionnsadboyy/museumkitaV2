<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eee3f0" />
    <meta
      name="description"
      content="Museum kecil untuk menyimpan cerita Dion dan Chelsea."
    />
    <title>Museum Kita — Dion &amp; Chelsea</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./media.css" />
    <link rel="stylesheet" href="./music-player.css?v=5" />
    <script defer src="./data.js"></script>
    <script defer src="./assets/media/manifest.js"></script>
    <script defer src="./media.js"></script>
    <script defer src="./museum-shell.js"></script>
    <script defer src="./music-playlist.js?v=5"></script>
    <script defer src="./music-player.js?v=5"></script>
  </head>
  <body>
    <main class="opening" id="top">
      <div class="backdrop" aria-hidden="true">
        <span class="media-image is-loading backdrop__photo backdrop__photo--sunset" style="--media-preview: url('data:image/webp;base64,UklGRngAAABXRUJQVlA4IGwAAAAQBACdASoLABQAPxFysFAsJqSisAgBgCIJYgCdMoADTiE9dP7pT8xQgAD+6DeT4BUAMBQvQ1ZwxN+ElpCBwfUANg9VscxZmGEqErc7gzVxWCtT67hGvI74MrpC7RE0KToASdyP0IqDQEojQAA=')"><img  src="/assets/thumbnails/painting-date/painting-date2.webp" alt="" decoding="async" loading="lazy"  width="450" height="800" /></span>
        <span class="media-image is-loading backdrop__photo backdrop__photo--together" style="--media-preview: url('data:image/webp;base64,UklGRoYAAABXRUJQVlA4IHoAAAAwBACdASoPABQAPxFysFAsJqSisAgBgCIJYgC/OCHhyBIyisStlnsuKwAA/tNnRN4e4pqMWC/Hmb8qpWF4o8YR5WFrR1SZ2F+ZWpcEwLz0vY3CzjDplSH//8yuZU5qoVCVc7BCvf7+gJyq9aGYFCZ64ppFEo82CMAAAA==')"><img  src="/assets/thumbnails/painting-date/painting-date8.webp" alt="" decoding="async" loading="lazy"  width="600" height="800" /></span>
        <span class="backdrop__wash"></span>
      </div>

      <article class="cover" aria-labelledby="cover-title">
        <header class="cover__top">
          <div class="private-label">
            <span class="private-label__dot" aria-hidden="true"></span>
            <span>Private Museum</span>
            <svg aria-hidden="true" viewBox="0 0 16 18" class="lock-icon">
              <path d="M4.3 7V5a3.7 3.7 0 0 1 7.4 0v2M3 7h10v9H3z" />
            </svg>
          </div>
          <span class="cover__seal" aria-hidden="true">✿</span>
        </header>

        <div class="cover__intro">
          <svg class="museum-mark" viewBox="0 0 40 32" aria-hidden="true">
            <path d="M3 10 20 2l17 8H3Z" />
            <path d="M6 12h28M8 13v13m8-13v13m8-13v13m8-13v13M5 28h30M3 31h34" />
          </svg>
          <p class="eyebrow">Welcome to</p>
          <h1 id="cover-title"><span>Our</span><span>Museum</span></h1>
          <p class="cover__motto">every memory<br />deserves a place.</p>
        </div>

        <div class="established">
          <span class="established__label">Established</span>
          <span class="established__rule" aria-hidden="true"></span>
          <span class="established__date">June 2026</span>
        </div>

        <blockquote class="quote-note">
          <span class="quote-note__mark" aria-hidden="true">“</span>
          <p>Some moments deserve<br class="desktop-break" /> more than a gallery.<br />They deserve a museum.</p>
          <span class="quote-note__heart" aria-hidden="true">♡</span>
        </blockquote>

        <a class="enter-button" href="./archive.html">
          <span>Enter Museum</span>
          <svg viewBox="0 0 28 20" aria-hidden="true"><path d="M2 10h23m-8-8 8 8-8 8" /></svg>
        </a>

        <footer class="cover__footer">
          <div class="footer-rule"><span aria-hidden="true">♡</span></div>
          <p>Curated for Dion &amp; Chelsea</p>
        </footer>

        <span class="scribble scribble--left" aria-hidden="true">♡</span>
        <span class="scribble scribble--right" aria-hidden="true">✳</span>
      </article>

      <figure class="polaroid polaroid--sunset" aria-hidden="true">
        <span class="media-image is-loading " style="--media-preview: url('data:image/webp;base64,UklGRngAAABXRUJQVlA4IGwAAAAQBACdASoLABQAPxFysFAsJqSisAgBgCIJYgCdMoADTiE9dP7pT8xQgAD+6DeT4BUAMBQvQ1ZwxN+ElpCBwfUANg9VscxZmGEqErc7gzVxWCtT67hGvI74MrpC7RE0KToASdyP0IqDQEojQAA=')"><img src="/assets/thumbnails/painting-date/painting-date2.webp" alt="" decoding="async" loading="eager"  width="450" height="800" /></span>
        <figcaption>little moments, kept close</figcaption>
      </figure>
      <figure class="polaroid polaroid--together" aria-hidden="true">
        <span class="media-image is-loading " style="--media-preview: url('data:image/webp;base64,UklGRoYAAABXRUJQVlA4IHoAAAAwBACdASoPABQAPxFysFAsJqSisAgBgCIJYgC/OCHhyBIyisStlnsuKwAA/tNnRN4e4pqMWC/Hmb8qpWF4o8YR5WFrR1SZ2F+ZWpcEwLz0vY3CzjDplSH//8yuZU5qoVCVc7BCvf7+gJyq9aGYFCZ64ppFEo82CMAAAA==')"><img src="/assets/thumbnails/painting-date/painting-date8.webp" alt="" decoding="async" loading="eager"  width="600" height="800" /></span>
        <figcaption>still here, still us.</figcaption>
      </figure>
    </main>
  </body>
</html>
